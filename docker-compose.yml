version: '3.8'

services:
  multica-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Agent CLI installation flags
        INSTALL_OPENCODE: ${INSTALL_OPENCODE:-true}
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-false}
        INSTALL_COPILOT: ${INSTALL_COPILOT:-false}
        INSTALL_CODEX: ${INSTALL_CODEX:-false}
        INSTALL_OPENCLAW: ${INSTALL_OPENCLAW:-false}
        INSTALL_HERMES: ${INSTALL_HERMES:-false}
        INSTALL_GEMINI: ${INSTALL_GEMINI:-false}
        INSTALL_CURSOR: ${INSTALL_CURSOR:-false}
    container_name: multica-daemon
    restart: unless-stopped
    environment:
      # Required: Your Multica authentication token
      MULTICA_TOKEN: ${MULTICA_TOKEN}
      
      # Self-hosted server URLs
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL:-http://localhost:8080}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3000}
      
      # Optional daemon configuration
      MULTICA_DAEMON_POLL_INTERVAL: ${MULTICA_DAEMON_POLL_INTERVAL:-3s}
      MULTICA_DAEMON_HEARTBEAT_INTERVAL: ${MULTICA_DAEMON_HEARTBEAT_INTERVAL:-15s}
      MULTICA_DAEMON_MAX_CONCURRENT_TASKS: ${MULTICA_DAEMON_MAX_CONCURRENT_TASKS:-20}
      MULTICA_AGENT_TIMEOUT: ${MULTICA_AGENT_TIMEOUT:-2h}
      
      # Optional: Custom daemon identification
      MULTICA_DAEMON_DEVICE_NAME: ${MULTICA_DAEMON_DEVICE_NAME:-${HOSTNAME}}
      
      # Git configuration (optional)
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      
      # Git HTTPS authentication (alternative to SSH keys)
      GIT_USERNAME: ${GIT_USERNAME:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_CREDENTIAL_HELPER: ${GIT_CREDENTIAL_HELPER:-store}
    volumes:
      # Persist Multica configuration
      - multica-config:/home/multica/.multica
      # Workspace directory for task execution
      - multica-workspaces:/home/multica/multica_workspaces
      # SSH keys for git private repository access
      # Mount your SSH private key (read-only)
      # - ${SSH_PRIVATE_KEY_PATH:-~/.ssh/id_rsa}:/home/multica/.ssh/id_rsa:ro
      # Optional: Mount SSH config if you have custom host configurations
      # - ${SSH_CONFIG_PATH:-~/.ssh/config}:/home/multica/.ssh/config:ro
      # Optional: Mount known_hosts to avoid host verification prompts
      # - ${SSH_KNOWN_HOSTS_PATH:-~/.ssh/known_hosts}:/home/multica/.ssh/known_hosts:ro
    
    # Optional: Connect to host network if your self-hosted instance is on localhost
    # NOTE: host network mode does NOT work on Windows/Mac Docker Desktop
    # On Windows/Mac, use host.docker.internal in your URLs instead
    # network_mode: "host"
    
    # Health check
    healthcheck:
      test: ["CMD", "multica", "daemon", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  multica-config:
    driver: local
  multica-workspaces:
    driver: local
